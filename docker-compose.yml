services:
  postgres:
    image: postgres:16-alpine
    container_name: store-rating-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: store_rating_platform
    ports:
      - "5432:5432"
    volumes:
      - store_rating_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d store_rating_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  store_rating_postgres:
